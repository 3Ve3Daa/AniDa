# Codemagic — сборка AniDa для iOS без своего Mac
# Как пользоваться — builds/ios/CLOUD-iOS.md
# По умолчанию: UNSIGNED сборка (CODE_SIGNING_ALLOWED=NO) → .ipa,
# который подписываешь сам через Sideloadly/AltStore бесплатным Apple ID.
workflows:
  ios-anida:
    name: AniDa iOS (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install --no-audit --no-fund
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: CocoaPods install
        script: cd ios/App && pod install
      - name: Xcode archive (no signing)
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/AniDa.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Pack unsigned .ipa
        script: |
          APP_PATH=$(find $CM_BUILD_DIR/AniDa.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          mkdir -p $CM_BUILD_DIR/Payload
          cp -R "$APP_PATH" $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR && zip -r AniDa-unsigned.ipa Payload
    artifacts:
      - AniDa-unsigned.ipa

